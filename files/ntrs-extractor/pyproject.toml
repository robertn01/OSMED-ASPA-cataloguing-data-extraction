[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ntrs-extractor"
version = "0.1.0"
description = "Three-pass ML/CV pipeline to catalogue and extract tables and figures from NASA NTRS historical reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
  "pdfplumber>=0.11",
  "camelot-py>=1.0",
  "opencv-python-headless>=4.9",
  "scikit-image>=0.22",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "reportlab>=4.0"]
fast = ["PyMuPDF>=1.24"]
ocr = ["pytesseract>=0.3"]

[project.scripts]
ntrs-extract = "ntrs_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
